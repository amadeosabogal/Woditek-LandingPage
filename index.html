<!doctype html>
<html lang="es" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/webp" href="/favicon.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Woditek | Diseño y Tecnologia</title>
  <meta name="description"
    content="Soluciones de software personalizadas que transforman ideas en realidad. Consultoría estratégica, desarrollo web y de productos digitales por Woditek." />
  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Archivo:wdth,wght@75..125,400..800&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet" />
</head>

<body class="bg-woditek-dark text-white font-sans antialiased overflow-x-hidden">
  <div id="error-log" style="color:red; background:white; position:fixed; z-index:9999; top:0; left:0; width:100%; white-space:pre-wrap;"></div>
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      document.getElementById('error-log').innerText += 'Error: ' + msg + '\n' + (error && error.stack ? error.stack : '');
    };
    window.onunhandledrejection = function(e) {
      document.getElementById('error-log').innerText += 'Promise Rejection: ' + e.reason + '\n';
    };
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
